name: Build CineLens iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 1. Get Dependencies & Generate iOS
        run: |
          flutter pub get
          rm -rf build/ios
          flutter create --platforms=ios .

      - name: 2. Build iOS Release Unsigned
        run: flutter build ios --release --no-codesign

      - name: 3. Pack to IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -ry CineLens_iOS.ipa Payload
          ls -lh CineLens_iOS.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineLens-iOS-IPA
          path: build/ios/ipa/CineLens_iOS.ipa
          if-no-files-found: error
