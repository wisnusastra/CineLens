name: Build CineLens iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 1. Get Dependencies
        run: flutter pub get

      - name: 2. Build iOS Release Unsigned
        shell: bash
        run: |
          set -o pipefail
          set -x

          # Paksa mode manual agar Xcode tidak mencari Development Team / akun Apple
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/Runner.xcodeproj/project.pbxproj

          # `set -o pipefail` matters: without it `tee` alone decides the exit
          # code and a failed xcodebuild would look like a successful step.
          flutter build ios --release --no-codesign --no-pub 2>&1 | tee build-ios.log

      - name: 3. Pack to IPA
        shell: bash
        run: |
          set -o pipefail

          {
            set -x
            echo "--- build/ios tree ---"
            find build/ios -maxdepth 2 -type d | head -n 40

            # Flutter has shipped the device bundle under both of these names.
            APP_PATH=""
            for candidate in \
              build/ios/iphoneos/Runner.app \
              build/ios/Release-iphoneos/Runner.app \
              build/ios/Release/Runner.app
            do
              if [ -d "$candidate" ]; then
                APP_PATH="$candidate"
                break
              fi
            done
            if [ -z "$APP_PATH" ]; then
              APP_PATH="$(find build/ios -maxdepth 4 -name Runner.app -type d | head -n 1)"
            fi

            echo "APP_PATH=$APP_PATH"
            if [ -z "$APP_PATH" ]; then
              echo "ERROR: Runner.app was not produced by the build."
              exit 1
            fi

            rm -rf build/ios/ipa
            mkdir -p build/ios/ipa/Payload
            cp -R "$APP_PATH" build/ios/ipa/Payload/
            cd build/ios/ipa
            zip -qry CineLens_iOS.ipa Payload
            ls -lh CineLens_iOS.ipa
            unzip -l CineLens_iOS.ipa | head -n 5
          } 2>&1 | tee pack-ipa.log

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineLens-iOS-IPA
          path: build/ios/ipa/CineLens_iOS.ipa
          if-no-files-found: error

      # Artifacts need a signed-in session to download. A release asset does
      # not, so the newest IPA is also published to a rolling `latest-ipa`
      # release that anyone can open in a browser.
      - name: Publish IPA to latest-ipa release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view latest-ipa >/dev/null 2>&1 || \
            gh release create latest-ipa \
              --title "CineLens iOS IPA (latest)" \
              --notes "Unsigned IPA built from the latest main build. Sideload with AltStore/Sideloadly."
          gh release upload latest-ipa build/ios/ipa/CineLens_iOS.ipa --clobber

      # Action logs are only readable while signed in, so the tail of every log
      # is pushed to the `ci-debug` branch to keep failures diagnosable.
      - name: Publish failure log
        if: failure()
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "workflow=$GITHUB_WORKFLOW sha=$GITHUB_SHA run=$GITHUB_RUN_ID"
            echo
            echo "===== flutter/xcodebuild errors ====="
            grep -n -E "error:|Swift Compiler Error|Error \(Xcode\)|BUILD FAILED|The following build commands failed|Undefined symbol|CocoaPods" build-ios.log 2>/dev/null | tail -n 120 || echo "(no build-ios.log)"
            echo
            echo "===== build-ios.log (tail 400) ====="
            tail -n 400 build-ios.log 2>/dev/null || echo "(no build-ios.log)"
            echo
            echo "===== pack-ipa.log (tail 120) ====="
            tail -n 120 pack-ipa.log 2>/dev/null || echo "(no pack-ipa.log)"
            echo
            echo "===== build/ios tree ====="
            find build/ios -maxdepth 3 2>/dev/null | head -n 80 || true
          } > ci-logs/last-run.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -f -B ci-debug
          git add -f ci-logs/last-run.log
          git commit -m "ci: capture last failed iOS run" || true
          git push -f origin ci-debug || true
