name: Build CineLens iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 1. Get Dependencies
        run: flutter pub get

      - name: 2. Build iOS Release Unsigned
        run: |
          # Paksa mode manual agar Xcode tidak mencari Development Team / akun Apple
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g' ios/Runner.xcodeproj/project.pbxproj

          flutter build ios --release --no-codesign --no-pub 2>&1 | tee build-ios.log

      # Xcode/Flutter failures are only visible to signed-in users, so a tail of
      # the log is pushed to the `ci-debug` branch to keep it diagnosable.
      - name: Capture failed build log
        if: failure()
        run: |
          mkdir -p ci-logs
          tail -n 500 build-ios.log > ci-logs/last-build.log || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug
          git add -f ci-logs/last-build.log
          git commit -m "ci: capture last failed iOS build log" || true
          git push -f origin ci-debug || true

      - name: 3. Pack to IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -ry CineLens_iOS.ipa Payload
          ls -lh CineLens_iOS.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineLens-iOS-IPA
          path: build/ios/ipa/CineLens_iOS.ipa
          if-no-files-found: error
