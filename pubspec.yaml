name: cinelens_ios
description: Hollywood Cinematic Camera for iOS with 24fps video, real-time 5x4 LUT color grading, custom tone studio, and JSON preset sharing.
publish_to: 'none'
version: 1.2.1+13

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  camera: ^0.11.0+2
  gal: ^2.3.0
  shared_preferences: ^2.3.3
  video_player: ^2.9.2
  share_plus: ^10.1.2
  file_picker: ^8.1.4
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  ios: true
  android: false
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - sample_presets/cinelens_sample_pack.json
